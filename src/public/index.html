<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewport</title>

<style>
:root {
  color-scheme: dark;
  --bg: #080b12;
  --panel: rgba(15, 20, 31, .92);
  --panel-solid: #0f141f;
  --surface: #171d2a;
  --surface-hover: #202839;
  --border: rgba(148, 163, 184, .16);
  --border-strong: rgba(148, 163, 184, .28);
  --text: #f7f9fc;
  --muted: #94a3b8;
  --accent: #7c6df2;
  --accent-strong: #9285ff;
  --success: #34d399;
  --danger: #fb7185;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
}

button,
input,
select {
  font: inherit;
}

.app {
  min-height: 100vh;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  position: relative;
  z-index: 2;
  padding: 18px 24px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(18px);
}

.topbar {
  max-width: 1540px;
  width: 100%;
  margin: 0 auto;
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, .13);
  border-radius: 12px;
  background: linear-gradient(145deg, #9185ff, #5b4bd7);
  box-shadow: 0 10px 30px rgba(124, 109, 242, .24);
  color: white;
  font-size: 18px;
  font-weight: 800;
}

.brand-name {
  font-size: 18px;
  font-weight: 720;
  letter-spacing: -.02em;
}

.brand-subtitle {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}

.connection-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: rgba(8, 11, 18, .48);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

.address-row {
  display: flex;
  gap: 10px;
}

.address-field {
  position: relative;
  flex: 1;
  min-width: 0;
}

.address-field::before {
  content: "↗";
  position: absolute;
  left: 15px;
  top: 50%;
  z-index: 1;
  transform: translateY(-50%);
  color: #64748b;
  font-size: 15px;
  pointer-events: none;
}

#url {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--border);
  background: rgba(8, 11, 18, .72);
  color: var(--text);
  border-radius: 12px;
  padding: 12px 15px 12px 40px;
  font-size: 14px;
  outline: none;
  transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
}

#url::selection {
  background: rgba(124, 109, 242, .4);
}

#url:focus {
  border-color: rgba(146, 133, 255, .75);
  background: #0b101a;
  box-shadow: 0 0 0 3px rgba(124, 109, 242, .14);
}

button {
  border: 1px solid var(--border);
  background: var(--surface);
  color: #dfe5ef;
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 620;
  cursor: pointer;
  transition: transform .14s ease, border-color .14s ease, background .14s ease, color .14s ease;
}

button:hover {
  border-color: var(--border-strong);
  background: var(--surface-hover);
  color: white;
}

button:active {
  transform: translateY(1px);
}

button:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent-strong);
  outline-offset: 2px;
}

#go {
  min-width: 78px;
  border-color: transparent;
  background: linear-gradient(135deg, var(--accent-strong), #6d5be7);
  color: white;
  box-shadow: 0 8px 24px rgba(124, 109, 242, .2);
}

#go:hover {
  background: linear-gradient(135deg, #a095ff, #7a68ef);
}

.controls {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  flex-wrap: wrap;
  gap: 16px;
  padding: 12px 20px 14px;
  border-bottom: 1px solid var(--border);
  background: rgba(11, 15, 24, .94);
}

.control-cluster {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.control-cluster.hidden {
  display: none;
}

.control-label {
  color: #718096;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .09em;
  text-transform: uppercase;
}

.segmented {
  display: flex;
  gap: 4px;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: rgba(8, 11, 18, .68);
}

.segmented button {
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 8px;
  padding: 7px 13px;
}

.segmented button:hover {
  background: rgba(255, 255, 255, .04);
  color: #dfe5ef;
}

.segmented button.active {
  background: #f5f7fb;
  color: #101522;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .28);
}

.device-picker {
  display: flex;
  flex-direction: column;
  gap: 6px;
  color: var(--muted);
}

.device-picker.hidden {
  display: none;
}

#device-profile {
  width: 210px;
  max-width: 42vw;
  border: 1px solid var(--border);
  background: var(--surface);
  color: #e5eaf2;
  border-radius: 10px;
  padding: 8px 34px 8px 11px;
  font-size: 13px;
  cursor: pointer;
}

#device-profile:hover {
  border-color: var(--border-strong);
  background: var(--surface-hover);
}

#rotate {
  min-height: 36px;
  padding-inline: 13px;
}

.workspace {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: auto;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 36px 32px 28px;
  background:
    radial-gradient(circle at 50% 0%, rgba(124, 109, 242, .12), transparent 34%),
    linear-gradient(rgba(148, 163, 184, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .035) 1px, transparent 1px),
    var(--bg);
  background-size: auto, 28px 28px, 28px 28px, auto;
}

.preview-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
}

.device {
  position: relative;
  background: linear-gradient(145deg, #171b24, #05070c);
  border: 1px solid rgba(255, 255, 255, .14);
  box-shadow:
    0 30px 90px rgba(0, 0, 0, .62),
    0 0 0 1px rgba(0, 0, 0, .55),
    inset 0 1px 0 rgba(255, 255, 255, .08);
  overflow: hidden;
  transition:
    width .22s ease,
    height .22s ease,
    border-radius .22s ease,
    padding .22s ease;
}

.device.desktop {
  border-radius: 12px;
  padding: 5px;
}

.device.tablet {
  border-radius: 27px;
  padding: 11px;
}

.device.mobile {
  border-radius: 37px;
  padding: 11px;
}

.screen {
  position: relative;
  background: white;
  overflow: hidden;
  width: 100%;
  height: 100%;
}

.desktop .screen {
  border-radius: 7px;
}

.tablet .screen {
  border-radius: 17px;
}

.mobile .screen {
  border-radius: 26px;
}

#browser {
  display: block;
  width: 100%;
  height: 100%;
  background: white;
  cursor: default;
  outline: none;
}

#browser:focus-visible {
  box-shadow: inset 0 0 0 2px var(--accent);
}

.loading {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
  justify-content: center;
  background: #0d121c;
  color: var(--muted);
  font-size: 13px;
  font-weight: 550;
  pointer-events: none;
}

.loading::before {
  content: "";
  width: 22px;
  height: 22px;
  border: 2px solid rgba(148, 163, 184, .2);
  border-top-color: var(--accent-strong);
  border-radius: 50%;
  animation: spin .75s linear infinite;
}

.loading.hidden {
  display: none;
}

.status {
  display: inline-flex;
  align-items: center;
  margin-top: 18px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: rgba(15, 20, 31, .78);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .24);
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  backdrop-filter: blur(10px);
}

.connection {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 8px;
  border-radius: 50%;
  background: #64748b;
  box-shadow: 0 0 0 3px rgba(100, 116, 139, .1);
}

.connection-badge .connection {
  margin-right: 0;
}

.connection.online {
  background: var(--success);
  box-shadow: 0 0 0 3px rgba(52, 211, 153, .12);
}

.connection.offline {
  background: var(--danger);
  box-shadow: 0 0 0 3px rgba(251, 113, 133, .12);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 700px) {
  header {
    padding: 14px;
  }

  .header-row {
    margin-bottom: 12px;
  }

  .brand-subtitle,
  .connection-text {
    display: none;
  }

  .connection-badge {
    padding: 8px;
  }

  .address-row {
    gap: 8px;
  }

  #go {
    min-width: 60px;
  }

  .controls {
    justify-content: flex-start;
    gap: 10px 12px;
    padding: 10px 12px 12px;
  }

  .segmented button {
    padding-inline: 10px;
  }

  #device-profile {
    width: 180px;
    max-width: 58vw;
  }

  .workspace {
    padding: 24px 10px 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>
<div class="app">

  <header>
    <div class="topbar">
      <div class="header-row">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">V</div>
          <div>
            <div class="brand-name">Viewport</div>
            <div class="brand-subtitle">Interactive responsive testing</div>
          </div>
        </div>

        <div class="connection-badge">
          <span id="header-connection" class="connection"></span>
          <span id="connection-text" class="connection-text">Connecting</span>
        </div>
      </div>

      <div class="address-row">
        <div class="address-field">
          <input
            id="url"
            type="text"
            value="https://example.com"
            autocomplete="off"
            spellcheck="false"
            aria-label="Website address"
          >
        </div>
        <button id="go">Open</button>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="control-cluster">
      <span class="control-label">Viewport</span>
      <div class="segmented">
        <button data-mode="desktop" class="active">Desktop</button>
        <button data-mode="tablet">Tablet</button>
        <button data-mode="mobile">Mobile</button>
      </div>
    </div>

    <label id="device-picker" class="device-picker hidden">
      <span class="control-label">Device</span>
      <select id="device-profile" aria-label="Device profile"></select>
    </label>

    <div id="rotate-control" class="control-cluster">
      <span class="control-label">Orientation</span>
      <button id="rotate">↻&nbsp; Rotate</button>
    </div>
  </div>

  <main class="workspace">
    <div class="preview-wrap">
      <div id="device" class="device desktop">
        <div class="screen">
          <canvas id="browser" tabindex="0"></canvas>
          <div id="loading" class="loading">Connecting to browser…</div>
        </div>
      </div>

      <div id="status" class="status">
        <span id="connection" class="connection"></span>
        <span id="status-detail">Connecting…</span>
      </div>
    </div>
  </main>

</div>

<script>
const sessionId =
  sessionStorage.getItem("viewportSession") ||
  crypto.randomUUID();

sessionStorage.setItem("viewportSession", sessionId);

const canvas = document.getElementById("browser");
const ctx = canvas.getContext("2d");

const device = document.getElementById("device");
const workspace = document.querySelector(".workspace");
const statusDetail = document.getElementById("status-detail");
const connectionEl = document.getElementById("connection");
const headerConnectionEl = document.getElementById("header-connection");
const connectionText = document.getElementById("connection-text");
const loadingEl = document.getElementById("loading");
const urlInput = document.getElementById("url");
const goButton = document.getElementById("go");
const rotateButton = document.getElementById("rotate");
const rotateControl = document.getElementById("rotate-control");
const devicePicker = document.getElementById("device-picker");
const deviceSelect = document.getElementById("device-profile");

let deviceProfiles = {
  mobile: [],
  tablet: []
};

let ws;
let state = {
  mode: "desktop",
  orientation: "landscape",
  viewport: {
    width: 1440,
    height: 900
  },
  label: "Desktop 1440 × 900"
};

let frameWidth = 1440;
let frameHeight = 900;

function fitDevice() {
  const vw = state.viewport?.width || frameWidth || 1440;
  const vh = state.viewport?.height || frameHeight || 900;

  const availableWidth = Math.max(280, workspace.clientWidth - 64);
  const availableHeight = Math.max(280, workspace.clientHeight - 94);

  const maxScale = state.mode === "desktop" ? 1 : 1.15;

  const scale = Math.min(
    availableWidth / vw,
    availableHeight / vh,
    maxScale
  );

  const width = Math.max(1, Math.round(vw * scale));
  const height = Math.max(1, Math.round(vh * scale));

  device.className = `device ${state.mode}`;
  device.style.width = `${width + (state.mode === "desktop" ? 10 : 22)}px`;
  device.style.height = `${height + (state.mode === "desktop" ? 10 : 22)}px`;

  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;

  rotateControl.classList.toggle(
    "hidden",
    state.mode === "desktop"
  );

  syncDevicePicker();

  document.querySelectorAll("[data-mode]").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.mode === state.mode
    );
  });

  statusDetail.textContent =
    `${state.label} • ${vw} × ${vh}`;
}

function syncDevicePicker() {
  const profiles = deviceProfiles[state.mode] || [];
  const isVisible = profiles.length > 0;

  devicePicker.classList.toggle("hidden", !isVisible);

  if (!isVisible) return;

  const existingProfiles = Array.from(
    deviceSelect.options,
    option => option.value
  );

  if (
    existingProfiles.length !== profiles.length ||
    existingProfiles.some((name, index) => name !== profiles[index])
  ) {
    deviceSelect.replaceChildren(
      ...profiles.map(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        return option;
      })
    );
  }

  if (state.device && profiles.includes(state.device)) {
    deviceSelect.value = state.device;
  }
}

async function loadDeviceProfiles() {
  try {
    const response = await fetch("/api/devices");

    if (!response.ok) {
      throw new Error("Unable to load device profiles");
    }

    const result = await response.json();
    deviceProfiles = result.profiles || deviceProfiles;
    syncDevicePicker();
  } catch (error) {
    console.error(error);
  }
}

function setConnection(online) {
  [connectionEl, headerConnectionEl].forEach(indicator => {
    indicator.classList.remove("online", "offline");
    indicator.classList.add(online ? "online" : "offline");
  });

  connectionText.textContent = online ? "Browser online" : "Reconnecting";
}

function connect() {
  const protocol =
    location.protocol === "https:" ? "wss:" : "ws:";

  ws = new WebSocket(
    `${protocol}//${location.host}/ws?session=${encodeURIComponent(sessionId)}`
  );

  ws.addEventListener("open", () => {
    setConnection(true);
  });

  ws.addEventListener("close", () => {
    setConnection(false);
    loadingEl.textContent = "Reconnecting…";
    loadingEl.classList.remove("hidden");

    setTimeout(connect, 1500);
  });

  ws.addEventListener("message", event => {
    const msg = JSON.parse(event.data);

    if (msg.type === "state") {
      state = msg;

      if (msg.url) {
        urlInput.value = msg.url;
      }

      fitDevice();
      return;
    }

    if (msg.type === "url") {
      if (msg.url && msg.url !== "about:blank") {
        urlInput.value = msg.url;
      }
      return;
    }

    if (msg.type === "frame") {
      drawFrame(msg.data);
    }
  });
}

function drawFrame(base64) {
  const image = new Image();

  image.onload = () => {
    frameWidth = image.naturalWidth;
    frameHeight = image.naturalHeight;

    if (
      canvas.width !== frameWidth ||
      canvas.height !== frameHeight
    ) {
      canvas.width = frameWidth;
      canvas.height = frameHeight;
    }

    ctx.drawImage(
      image,
      0,
      0,
      frameWidth,
      frameHeight
    );

    loadingEl.classList.add("hidden");
  };

  image.src = `data:image/jpeg;base64,${base64}`;
}

function browserCoordinates(event) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: (event.clientX - rect.left) *
       (state.viewport.width / rect.width),

    y: (event.clientY - rect.top) *
       (state.viewport.height / rect.height)
  };
}

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

canvas.addEventListener("mousemove", event => {
  const point = browserCoordinates(event);

  send({
    type: "move",
    x: point.x,
    y: point.y
  });
});

canvas.addEventListener("click", event => {
  const point = browserCoordinates(event);

  canvas.focus();

  send({
    type: "click",
    x: point.x,
    y: point.y
  });
});

canvas.addEventListener(
  "wheel",
  event => {
    event.preventDefault();

    send({
      type: "scroll",
      deltaX: event.deltaX,
      deltaY: event.deltaY
    });
  },
  { passive: false }
);

canvas.addEventListener("keydown", event => {
  event.preventDefault();

  const specialKeys = {
    Enter: "Enter",
    Backspace: "Backspace",
    Delete: "Delete",
    Tab: "Tab",
    Escape: "Escape",
    ArrowUp: "ArrowUp",
    ArrowDown: "ArrowDown",
    ArrowLeft: "ArrowLeft",
    ArrowRight: "ArrowRight",
    Home: "Home",
    End: "End",
    PageUp: "PageUp",
    PageDown: "PageDown"
  };

  if (specialKeys[event.key]) {
    send({
      type: "keydown",
      key: specialKeys[event.key]
    });

    return;
  }

  if (
    event.key.length === 1 &&
    !event.ctrlKey &&
    !event.metaKey &&
    !event.altKey
  ) {
    send({
      type: "text",
      text: event.key
    });
  }
});

async function loadUrl() {
  const value = urlInput.value.trim();

  if (!value) return;

  loadingEl.textContent = "Loading…";
  loadingEl.classList.remove("hidden");

  try {
    const response = await fetch("/api/load", {
      headers: {
        "Content-Type": "application/json",
        "X-Viewport-Session": sessionId
      },
      method: "POST",
      body: JSON.stringify({
        url: value
      })
    });

    const result = await response.json();

    if (!result.ok) {
      throw new Error(result.error || "Unable to load URL");
    }
  } catch (error) {
    loadingEl.textContent = error.message;
  }
}

goButton.addEventListener("click", loadUrl);

urlInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    loadUrl();
  }
});

document.querySelectorAll("[data-mode]").forEach(button => {
  button.addEventListener("click", async () => {
    loadingEl.textContent = "Changing device…";
    loadingEl.classList.remove("hidden");

    await fetch("/api/mode", {
      headers: {
        "Content-Type": "application/json",
        "X-Viewport-Session": sessionId
      },
      method: "POST",
      body: JSON.stringify({
        mode: button.dataset.mode
      })
    });
  });
});

rotateButton.addEventListener("click", async () => {
  loadingEl.textContent = "Rotating device…";
  loadingEl.classList.remove("hidden");

  await fetch("/api/rotate", {
      headers: {
        "X-Viewport-Session": sessionId
      },
    method: "POST"
  });
});

deviceSelect.addEventListener("change", async () => {
  loadingEl.textContent = "Changing device…";
  loadingEl.classList.remove("hidden");

  try {
    const response = await fetch("/api/device", {
      headers: {
        "Content-Type": "application/json",
        "X-Viewport-Session": sessionId
      },
      method: "POST",
      body: JSON.stringify({
        mode: state.mode,
        device: deviceSelect.value
      })
    });
    const result = await response.json();

    if (!result.ok) {
      throw new Error(result.error || "Unable to change device");
    }
  } catch (error) {
    loadingEl.textContent = error.message;
    syncDevicePicker();
  }
});

window.addEventListener("resize", fitDevice);

loadDeviceProfiles();
connect();
fitDevice();
</script>
</body>
</html>
